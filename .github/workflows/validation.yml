---
name: Repository validation

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ntp-baseline-offline:
    name: NTP baseline collector offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run synthetic collector tests
        run: ntpsec/tests/run.sh

  baseline:
    name: Baseline validation
    uses: >-
      Racerx323/homelab-docs/.github/workflows/reusable-validation.yml@7d09aae0bdf0fe80bc10263d1e8e5c682037d848
