# Candidate until the separately approved cutover is accepted.
driftfile /var/lib/ntpsec/drift/ntp.drift
leapfile /var/lib/ntpsec/leap-seconds.list
statsdir /var/log/ntpstats/
statistics loopstats peerstats clockstats
filegen loopstats file loopstats type day enable
filegen peerstats file peerstats type day enable
filegen clockstats file clockstats type day enable

interface ignore all
interface listen lo
interface listen eth0

restrict -4 default ignore
restrict -6 default ignore
restrict source notrust nomodify noquery
restrict 127.0.0.1
restrict ::1
restrict 10.1.0.0/22 nomodify noquery limited kod
restrict fd36:5aa8:6971:1::/64 nomodify noquery limited kod

refclock shm unit 0 refid NMEA
refclock shm unit 2 prefer refid PPS flag4 1

server time.cloudflare.com nts iburst
server ohio.time.system76.com nts iburst
server oregon.time.system76.com nts iburst
